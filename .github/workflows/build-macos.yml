name: Build macOS app

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build without release secrets
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - &select-xcode
        name: Select full Xcode toolchain
        run: |
          xcode_path=$(xcode-select -p 2>/dev/null | sed 's#/Contents/Developer$##')
          if [ ! -d "$xcode_path" ] || [[ "$xcode_path" != /Applications/Xcode*.app ]]; then
            xcode_path=$(find /Applications -type d -name 'Xcode*.app' -prune -print | sort | head -n 1)
          fi
          test -n "$xcode_path"
          sudo xcode-select --switch "$xcode_path/Contents/Developer"
          sudo xcodebuild -runFirstLaunch
          xcodebuild -version
          swiftc --version
          xcrun --sdk macosx --show-sdk-build-version
      - name: Run all test suites
        run: |
          chmod +x scripts/*.sh
          swift test
          ./scripts/test-saver-manifest.sh
          ./scripts/test-login-launch-policy.sh
          ./scripts/test-video-library-workflow.sh
      - name: Enforce strict concurrency readiness
        run: swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
      - name: Build clean universal release app
        run: ./scripts/package-app.sh release
      - name: Verify deployment contract
        run: ./scripts/verify-release-artifacts.sh adhoc
      - name: Upload unnotarized CI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: my-wallpaper-ci-${{ github.sha }}
          if-no-files-found: error
          path: dist/My Wallpaper.app

  release-build:
    name: Sign, notarize, and package tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-14
    environment: production-release
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - *select-xcode
      - name: Require complete release credentials
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          test -n "$MACOS_CERTIFICATE_BASE64"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          test -n "$MACOS_KEYCHAIN_PASSWORD"
          test -n "$MACOS_SIGNING_IDENTITY"
          test -n "$APPLE_ID"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_APP_PASSWORD"
      - name: Require matching release tag
        run: |
          source support/version.env
          test "$GITHUB_REF_NAME" = "v$MY_WALLPAPER_MARKETING_VERSION"
      - name: Build clean universal release app
        run: |
          chmod +x scripts/*.sh
          ./scripts/package-app.sh release
      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/my-wallpaper-signing.keychain-db"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -t cert -f pkcs12 -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          rm -f "$certificate_path"
      - name: Sign and verify Developer ID contract
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          app="dist/My Wallpaper.app"
          saver="$app/Contents/Resources/My Wallpaper.saver"
          codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$saver"
          codesign --force --options runtime --timestamp \
            --entitlements support/MyWallpaper.entitlements \
            --sign "$MACOS_SIGNING_IDENTITY" "$app"
          ./scripts/verify-release-artifacts.sh developer-id "$APPLE_TEAM_ID"
      - name: Notarize and staple app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          notary_zip="$RUNNER_TEMP/My-Wallpaper-notary.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/My Wallpaper.app" "$notary_zip"
          xcrun notarytool submit "$notary_zip" --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "dist/My Wallpaper.app"
          xcrun stapler validate "dist/My Wallpaper.app"
          spctl --assess --type execute --verbose=2 "dist/My Wallpaper.app"
      - name: Create, notarize, and validate installer
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ./scripts/create-dmg.sh
          xcrun notarytool submit "dist/My-Wallpaper.dmg" --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "dist/My-Wallpaper.dmg"
          xcrun stapler validate "dist/My-Wallpaper.dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "dist/My-Wallpaper.dmg"
          hdiutil imageinfo "dist/My-Wallpaper.dmg" >/dev/null
      - name: Create checksummed release artifacts
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/My Wallpaper.app" "dist/My-Wallpaper.app.zip"
          shasum -a 256 "dist/My-Wallpaper.dmg" "dist/My-Wallpaper.app.zip" > dist/SHA256SUMS
      - name: Upload signed release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: my-wallpaper-release-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            dist/My-Wallpaper.dmg
            dist/My-Wallpaper.app.zip
            dist/SHA256SUMS

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-build
    runs-on: macos-14
    permissions:
      contents: write
    environment: production-release
    steps:
      - name: Download signed release artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: my-wallpaper-release-${{ github.ref_name }}
          path: release-assets
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/My-Wallpaper.dmg \
            release-assets/My-Wallpaper.app.zip \
            release-assets/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --title "My Wallpaper $GITHUB_REF_NAME"
