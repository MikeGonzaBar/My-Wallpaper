name: Build macOS app

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and package
    runs-on: macos-14
    env:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY || 'Developer ID Application' }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run Swift tests
        run: swift test

      - name: Build release app
        run: |
          chmod +x scripts/*.sh
          ./scripts/package-app.sh release

      - name: Import Developer ID certificate
        if: ${{ env.MACOS_CERTIFICATE_BASE64 != '' }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/my-wallpaper-signing.keychain-db"
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"

      - name: Sign with Developer ID
        if: ${{ env.MACOS_CERTIFICATE_BASE64 != '' }}
        run: |
          codesign --force --deep --options runtime \
            --sign "$MACOS_SIGNING_IDENTITY" \
            "dist/My Wallpaper.app"

      - name: Create installer DMG
        run: ./scripts/create-dmg.sh

      - name: Verify app and screen saver bundles
        run: |
          codesign --verify --deep --strict --verbose=2 "dist/My Wallpaper.app"
          codesign --verify --deep --strict --verbose=2 "dist/My Wallpaper.app/Contents/Resources/My Wallpaper.saver"
          test -d "dist/My Wallpaper.app/Contents/Resources/My Wallpaper.saver"
          lipo -archs "dist/My Wallpaper.app/Contents/Resources/My Wallpaper.saver/Contents/MacOS/MyWallpaperScreenSaver" | grep -Eq '(^| )arm64( |$)'
          lipo -archs "dist/My Wallpaper.app/Contents/Resources/My Wallpaper.saver/Contents/MacOS/MyWallpaperScreenSaver" | grep -Eq '(^| )x86_64( |$)'
          hdiutil imageinfo "dist/My-Wallpaper.dmg" >/dev/null

      - name: Notarize and staple installer
        if: ${{ env.APPLE_ID != '' && env.MACOS_CERTIFICATE_BASE64 != '' }}
        run: |
          xcrun notarytool submit "dist/My-Wallpaper.dmg" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "dist/My-Wallpaper.dmg"

      - name: Create app zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/My Wallpaper.app" \
            "dist/My-Wallpaper.app.zip"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-wallpaper-macos
          if-no-files-found: error
          path: |
            dist/My-Wallpaper.dmg
            dist/My-Wallpaper.app.zip

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          name: my-wallpaper-macos
          path: release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/My-Wallpaper.dmg \
            release-assets/My-Wallpaper.app.zip \
            --generate-notes \
            --title "My Wallpaper $GITHUB_REF_NAME"
